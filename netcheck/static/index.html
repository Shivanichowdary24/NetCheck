<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetCheck - TCP Network Health Monitor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
                <h1>NetCheck</h1>
            </div>
            <p class="subtitle">TCP Network Health Monitor</p>
        </header>

        <main>
            <section class="check-card">
                <div class="form-row">
                    <div class="input-group">
                        <label for="host">Hostname / IP Address</label>
                        <input type="text" id="host" placeholder="example.com or 8.8.8.8" autocomplete="off">
                    </div>
                    <div class="input-group input-port">
                        <label for="port">Port</label>
                        <input type="number" id="port" placeholder="443" min="1" max="65535" autocomplete="off">
                    </div>
                </div>
                <button id="checkBtn" class="btn-check">
                    <span class="btn-text">Check Connection</span>
                    <span class="btn-spinner" hidden></span>
                </button>
                <p id="errorMsg" class="error-msg" hidden></p>
            </section>

            <section id="resultCard" class="result-card" hidden>
                <div class="result-header">
                    <div class="status-badge" id="statusBadge">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">--</span>
                    </div>
                    <span class="target-label" id="targetLabel"></span>
                </div>
                <div class="result-grid">
                    <div class="result-item">
                        <span class="result-label">Latency</span>
                        <span class="result-value" id="latencyValue">--</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Timestamp</span>
                        <span class="result-value mono" id="timestampValue">--</span>
                    </div>
                    <div class="result-item result-error" id="errorItem" hidden>
                        <span class="result-label">Error</span>
                        <span class="result-value" id="errorValue">--</span>
                    </div>
                </div>
            </section>

            <section class="history-card">
                <h2>Recent Checks</h2>
                <div id="historyList" class="history-list">
                    <p class="empty-state">No checks yet. Try checking a host above.</p>
                </div>
            </section>
        </main>

        <footer>
            <p>NetCheck &middot; TCP connection monitoring &middot; In-memory history (last 10)</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
